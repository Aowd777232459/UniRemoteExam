name: Server CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore UniRemoteExam.csproj

      - name: Build
        run: dotnet build UniRemoteExam.csproj --configuration Release --no-restore

      - name: Publish server
        run: dotnet publish UniRemoteExam.csproj --configuration Release --no-build --output artifacts/server

      - name: Upload server package
        uses: actions/upload-artifact@v4
        with:
          name: UniRemoteExam-Server
          path: artifacts/server
          if-no-files-found: error
          retention-days: 30
