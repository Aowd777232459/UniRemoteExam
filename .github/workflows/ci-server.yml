name: Server CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore UniRemoteExam.csproj

      - name: Build
        run: dotnet build UniRemoteExam.csproj --configuration Release --no-restore

      - name: Publish server
        run: dotnet publish UniRemoteExam.csproj --configuration Release --no-build --output artifacts/server

      - name: Test LAN server and embedded database
        shell: bash
        run: |
          export UNIREMOTE_LAN_MODE=true
          dotnet artifacts/server/UniRemoteExam.dll > lan-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5113/health > health.json; then
              ready=true
              break
            fi
            sleep 0.5
          done

          if test "$ready" != true; then
            cat lan-server.log
            exit 1
          fi

          grep '"status":"healthy"' health.json
          grep '"database":"connected"' health.json
          curl --fail --silent --cookie-jar cookies.txt http://127.0.0.1:5113/ --output login.html
          grep 'نظام الاختبارات' login.html

          token="$(grep -oP 'name="__RequestVerificationToken"[^>]*value="\K[^"]+' login.html | head -n 1)"
          test -n "$token"
          curl --silent --show-error \
            --cookie cookies.txt \
            --cookie-jar cookies.txt \
            --data-urlencode "email=admin@sanaau.edu.ye" \
            --data-urlencode "password=Demo@12345" \
            --data-urlencode "__RequestVerificationToken=$token" \
            --dump-header login-headers.txt \
            --output login-result.html \
            http://127.0.0.1:5113/Account/Login
          grep -i '^location: /Account/ChangePassword' login-headers.txt

      - name: Upload server package
        uses: actions/upload-artifact@v4
        with:
          name: UniRemoteExam-Server
          path: artifacts/server
          if-no-files-found: error
          retention-days: 30
