name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "Apps/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Android workload
        run: dotnet workload install maui-android

      - name: Prepare signing
        id: signing
        shell: bash
        run: |
          if test -n "$ANDROID_KEYSTORE_BASE64" \
            && test -n "$ANDROID_KEY_ALIAS" \
            && test -n "$ANDROID_KEYSTORE_PASSWORD" \
            && test -n "$ANDROID_KEY_PASSWORD"; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/uniremoteexam.keystore"
            echo "has_release_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are missing; producing an installable test-signed Release APK."
          fi

      - name: Restore Android app
        run: dotnet restore Apps/UniRemoteExam.Client/UniRemoteExam.Client.csproj -p:TargetFramework=net10.0-android

      - name: Publish signed APK
        if: steps.signing.outputs.has_release_key == 'true'
        shell: bash
        run: |
          dotnet publish Apps/UniRemoteExam.Client/UniRemoteExam.Client.csproj \
            -f net10.0-android \
            -c Release \
            -p:AndroidPackageFormats=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/uniremoteexam.keystore" \
            -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD" \
            -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD"
          mkdir -p artifacts/android
          signed_apk="$(find Apps/UniRemoteExam.Client/bin/Release/net10.0-android -type f -name '*-Signed.apk' -print -quit)"
          test -n "$signed_apk" || { echo "Signed APK was not produced"; exit 1; }
          cp "$signed_apk" artifacts/android/UniRemoteExam-Android.apk

      - name: Publish test-signed Release APK
        if: steps.signing.outputs.has_release_key != 'true'
        shell: bash
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/uniremoteexam-testing.keystore" \
            -storepass uniremoteexam-testing \
            -keypass uniremoteexam-testing \
            -alias uniremoteexam-testing \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=UniRemoteExam Testing, O=Sana'a University, C=YE"
          dotnet publish Apps/UniRemoteExam.Client/UniRemoteExam.Client.csproj \
            -f net10.0-android \
            -c Release \
            -p:AndroidPackageFormats=apk \
            -p:TrimMode=partial \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/uniremoteexam-testing.keystore" \
            -p:AndroidSigningKeyAlias=uniremoteexam-testing \
            -p:AndroidSigningStorePass=uniremoteexam-testing \
            -p:AndroidSigningKeyPass=uniremoteexam-testing
          mkdir -p artifacts/android
          signed_apk="$(find Apps/UniRemoteExam.Client/bin/Release/net10.0-android -type f -name '*-Signed.apk' -print -quit)"
          test -n "$signed_apk" || { echo "Installable test-signed APK was not produced"; exit 1; }
          cp "$signed_apk" artifacts/android/UniRemoteExam-Android.apk

      - name: Verify APK signature and package
        shell: bash
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose artifacts/android/UniRemoteExam-Android.apk
          "$build_tools/aapt" dump badging artifacts/android/UniRemoteExam-Android.apk | grep "package: name='ye.edu.sanaau.uniremoteexam'"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch test on Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r artifacts/android/UniRemoteExam-Android.apk
            adb logcat -c
            adb shell monkey -p ye.edu.sanaau.uniremoteexam -c android.intent.category.LAUNCHER 1
            sleep 12
            app_pid="$(adb shell pidof ye.edu.sanaau.uniremoteexam | tr -d '\r')"
            test -n "$app_pid" || { adb logcat -d '*:E' | tail -n 300; exit 1; }
            adb shell dumpsys activity activities | grep -q 'mResumedActivity.*ye.edu.sanaau.uniremoteexam'
            adb exec-out screencap -p > artifacts/android/launch-smoke.png

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UniRemoteExam-Android-APK
          path: artifacts/android/UniRemoteExam-Android.apk
          if-no-files-found: error
          retention-days: 30
