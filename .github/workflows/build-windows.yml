name: Build Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Windows workload
        run: dotnet workload install maui-windows

      - name: Restore Windows app
        run: dotnet restore Apps/UniRemoteExam.Client/UniRemoteExam.Client.csproj -p:TargetFramework=net10.0-windows10.0.19041.0

      - name: Publish self-contained Windows app
        run: >-
          dotnet publish Apps/UniRemoteExam.Client/UniRemoteExam.Client.csproj
          -f net10.0-windows10.0.19041.0
          -c Release
          -p:WindowsPackageType=None
          -p:RuntimeIdentifierOverride=win-x64
          -p:WindowsAppSDKSelfContained=true
          --self-contained true
          -o artifacts/windows-publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Create installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/windows | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DPublishDir=$((Resolve-Path 'artifacts/windows-publish').Path)" `
            "/DOutputDir=$((Resolve-Path 'artifacts/windows').Path)" `
            "/DAppVersion=1.0.0" `
            "Installer/UniRemoteExam.iss"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: UniRemoteExam-Windows-Installer
          path: artifacts/windows/UniRemoteExam-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 30
