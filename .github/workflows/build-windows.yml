name: Build Windows Installer

on:
  push:
    branches: [main]
    paths:
      - "Areas/**"
      - "Apps/**"
      - "Controllers/**"
      - "Data/**"
      - "Installer/**"
      - "Models/**"
      - "Services/**"
      - "Views/**"
      - "wwwroot/**"
      - "Program.cs"
      - "UniRemoteExam.csproj"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Windows workload
        run: dotnet workload install maui-windows

      - name: Restore Windows app
        run: dotnet restore Apps/UniRemoteExam.Client/UniRemoteExam.Client.csproj -p:TargetFramework=net10.0-windows10.0.19041.0

      - name: Publish self-contained Windows client
        run: >-
          dotnet publish Apps/UniRemoteExam.Client/UniRemoteExam.Client.csproj
          -f net10.0-windows10.0.19041.0
          -c Release
          -p:WindowsPackageType=None
          -p:RuntimeIdentifierOverride=win-x64
          -p:WindowsAppSDKSelfContained=true
          --self-contained true
          -o artifacts/windows-client-publish

      - name: Publish self-contained LAN server
        run: >-
          dotnet publish UniRemoteExam.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o artifacts/windows-server-publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Create installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/windows | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DClientPublishDir=$((Resolve-Path 'artifacts/windows-client-publish').Path)" `
            "/DServerPublishDir=$((Resolve-Path 'artifacts/windows-server-publish').Path)" `
            "/DOutputDir=$((Resolve-Path 'artifacts/windows').Path)" `
            "/DAppVersion=1.0.2" `
            "Installer/UniRemoteExam.iss"

      - name: Create ZIP fallback
        shell: powershell
        run: |
          Compress-Archive `
            -Path artifacts/windows/UniRemoteExam-LAN-Windows-Setup.exe `
            -DestinationPath artifacts/windows/UniRemoteExam-LAN-Windows-Installer.zip `
            -CompressionLevel Optimal `
            -Force

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: UniRemoteExam-LAN-Windows-Installer
          path: |
            artifacts/windows/UniRemoteExam-LAN-Windows-Setup.exe
            artifacts/windows/UniRemoteExam-LAN-Windows-Installer.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish permanent GitHub download
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "lan-v1.0.2"
          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo "${{ github.repository }}" `
              --target "${{ github.sha }}" `
              --title "UniRemoteExam LAN v1.0.2" `
              --notes "LAN version: the computer hosts the server and database, and Android connects over the same Wi-Fi without cloud hosting."
          }
          gh release upload $tag `
            artifacts/windows/UniRemoteExam-LAN-Windows-Setup.exe `
            artifacts/windows/UniRemoteExam-LAN-Windows-Installer.zip `
            --clobber `
            --repo "${{ github.repository }}"
