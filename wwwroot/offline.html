<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#073b31" />
  <title>لا يوجد اتصال</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#f4f7fb,#eef7f3);font-family:Tahoma,Arial,sans-serif;color:#102a24;padding:20px}.card{width:min(100%,520px);background:#fff;border:1px solid #e5edf3;border-radius:28px;padding:34px;text-align:center;box-shadow:0 24px 60px rgba(16,42,36,.12)}.icon{width:86px;height:86px;border-radius:28px;margin:0 auto 20px;display:grid;place-items:center;background:#eef7f3;color:#073b31;font-size:42px}h1{font-size:26px;margin:0 0 12px}p{line-height:1.9;color:#64748b;font-weight:700}button{border:0;border-radius:16px;background:#073b31;color:#fff;padding:13px 24px;font-size:16px;font-weight:900;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">↻</div>
    <h1>تعذر الاتصال بالخادم</h1>
    <p>تحقق من اتصال الإنترنت أو الشبكة، ثم أعد المحاولة. لن تُعرض بيانات اختبارات محفوظة قديمة حفاظًا على الدقة والأمان.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
  </main>
</body>
</html>
